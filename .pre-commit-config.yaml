# .pre-commit-config.yaml

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: no-commit-to-branch
        args: [--branch, main] # Specify the branch to prevent direct commits
  # Run mypy through the project's own environment rather than mirrors-mypy. That hook runs in
  # an isolated venv with `--ignore-missing-imports` and none of the project's dependencies, so
  # crewai/langchain/rich all degrade to `Any` and it reports success on errors CI then fails on.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy scan tests
        language: system
        types: [python]
        pass_filenames: false
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.3
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
