[build-system]
# >=1.27 is required for the bare SPDX `license` string below (PEP 639).
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "scan"
version = "1.0.0"
# 3.13 is blocked by the pinned stack, not by SCAN: crewai 0.76.9 resolves numpy 1.26.4, which
# has no cp313 wheels.
requires-python = ">=3.10,<3.13"
description = "A multi-agent system that models prefrontal-cortex function to help reason about a decision."
readme = "README.md"
authors = [ { name = "iLevyTate" } ]
license = "MIT"
keywords = ["multi-agent", "llm", "crewai", "prefrontal-cortex", "decision-making", "cognitive-science"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]

dependencies = [
  "crewai==0.76.9",
  "google-search-results==2.4.2",
  "langchain==0.3.7",
  "langchain-community==0.3.4",
  "langchain-openai==0.2.6",
  "openai==1.54.3",
  "pydantic==2.11.3",
  "pydantic-settings==2.6.1",
  "rich==13.9.4",
]

# Keep [project.urls] and every other sub-table below all bare [project] keys: a key placed
# after a sub-table header belongs to that table, not to [project].
[project.urls]
Homepage = "https://github.com/iLevyTate/SCAN"
Repository = "https://github.com/iLevyTate/SCAN"
Issues = "https://github.com/iLevyTate/SCAN/issues"
Zenodo = "https://doi.org/10.5281/zenodo.14052884"

[dependency-groups]
dev = [
  "mypy[faster-cache]==1.13.0",
  "pre-commit==4.0.1",
  "pytest==8.3.3",
  "pytest-cov==6.0.0",
  "ruff==0.7.3",
]

[project.scripts]
run-scan = "scan.cli:main"

[tool.mypy]
strict = true
warn_unreachable = true
# Pin the target version: CI lints on 3.10 (the floor), but a developer's venv may be newer.
python_version = "3.10"

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["crewai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
addopts = "--cov=scan --cov-report term-missing --cov-fail-under=95 --strict-markers --strict-config -ra"

[tool.coverage.run]
branch = true
source = ["scan"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# Deliberately no `fix = true`: it made `ruff check` auto-repair the working tree and exit 0,
# so the CI lint gate could never fail. Fixing is opt-in via `ruff check --fix` (see the
# pre-commit hook), while plain `ruff check` stays a real check.

[tool.ruff.lint]
select = [
  "E",  # pycodestyle
  "B",  # flake8-bugbear
  "W",  # Warning
  "F",  # pyflakes
  "UP",  # pyupgrade
  "I001",  # unsorted-imports
  "T201",  # print found
  "T203",  # pprint found
]
ignore = [
  # Formatter conflicts. D/Q/COM/ISC entries used to be listed here too, but none of those
  # rule families is selected, so they were suppressing rules that never ran.
  "E501",
  "W191",
  "E111",
  "E114",
  "E117",
]
